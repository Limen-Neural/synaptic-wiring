# Claude Code on GitHub: reply to `@claude` mentions on issues, PRs and reviews.
#
# Runs through the Claude GitHub App, so comments and issues it creates are
# authored by `claude[bot]`, not by a personal account.
#
# Requires, in repo Settings → Secrets and variables → Actions:
#   ANTHROPIC_API_KEY   (do not commit it)
# and the Claude GitHub App installed on this repository.
#
# Only repository members, owners and collaborators can trigger it. Third-party
# Actions are pinned to a commit SHA (v1.0.99), matching the other workflows.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    name: Claude
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Keep the toolchain in lockstep with Cargo.toml `rust-version`
      # (REVIEW.md "MSRV pin rule"); the validate job in ci.yml only scans
      # ci.yml and coverage.yml, so update this pin by hand when MSRV moves.
      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Run Claude
        uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Let Claude file and list issues with the App token, and run the
          # repo's own checks from REVIEW.md before proposing changes.
          claude_args: |
            --allowedTools "Bash(gh issue create:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(cargo fmt:*),Bash(cargo clippy:*),Bash(cargo test:*),Bash(cargo doc:*)"
