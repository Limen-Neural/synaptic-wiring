# Claude Code on GitHub: reply to `@claude` mentions on issues, PRs and reviews.
#
# Runs through the Claude GitHub App, so comments and issues it creates are
# authored by `claude[bot]`, not by a personal account.
#
# Requires, in repo Settings → Secrets and variables → Actions:
#   CLAUDE_CODE_OAUTH_TOKEN   (Claude Max/Pro subscription token from running
#                              `claude setup-token` locally; do not commit it)
# and the Claude GitHub App installed on this repository.
#
# Only repository members, owners and collaborators can trigger it. Third-party
# Actions are pinned to a commit SHA (v1.0.99), matching the other workflows.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # `assigned` is deliberately not a trigger: on that event
  # `issue.author_association` describes the issue author, not the person
  # assigning, so a collaborator assigning an outsider's issue would pass the
  # collaborator check below with attacker-written text.
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  claude:
    name: Claude
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Least privilege: this workflow files issues and comments, which needs no
    # push access. Raise `contents` to `write` only if you want @claude to push
    # branches and commits.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      # Required by claude-code-action to exchange the job's OIDC token for the
      # Claude GitHub App token; that exchange is what makes comments and
      # issues show as `claude[bot]`. It grants no access to cloud providers
      # unless a cloud trust policy is configured for this repository.
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude
        uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Only issue commands. Cargo is deliberately not allowed: it runs
          # build.rs and test binaries from the checked-out code, which would
          # execute untrusted PR code with the subscription token in scope.
          claude_args: |
            --allowedTools "Bash(gh issue create:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*)"
