name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Dev/CI toolchain pins (this job, package, cargo-deny, coverage,
      # rust-toolchain.toml) must agree with each other and be >= the true
      # MSRV in Cargo.toml `rust-version`; the two may differ (#106).
      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Verify toolchain pins agree and cover the MSRV
        # Git Bash: grep/sed and the here-string must run on Windows too.
        shell: bash
        run: |
          set -euo pipefail
          strip_cr() { tr -d '\r'; }
          cargo_rv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          toolchain_ch=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          # Every `toolchain:` / `rust-version:` pin in ci.yml and coverage.yml
          # is a *dev toolchain* pin and must match rust-toolchain.toml's
          # channel, so a job added later (or a partial bump) cannot
          # introduce a second, silently diverging Rust version. The `msrv`
          # job below deliberately has no literal pin — it reads
          # `rust-version` from Cargo.toml at run time.
          # Values are captured verbatim — `nightly`, `stable`, or
          # `${{ matrix.rust }}` is a mismatch, not something to skip over.
          workflow_pins=""
          for wf in .github/workflows/ci.yml .github/workflows/coverage.yml; do
            pins=$(grep -E '^[[:space:]]*(toolchain|rust-version):[[:space:]]*[^[:space:]]' \
              "$wf" | strip_cr \
              | sed -E "s/^[[:space:]]*(toolchain|rust-version):[[:space:]]*//; s/[[:space:]]+\$//; s/^[\"'](.*)[\"']\$/\1/")
            if [ -z "$pins" ]; then
              echo "ERROR: no toolchain:/rust-version: pin found in $wf" >&2
              exit 1
            fi
            printf '%s pins:\n%s\n' "$wf" "$(echo "$pins" | sed 's/^/  /')"
            workflow_pins="${workflow_pins}${workflow_pins:+$'\n'}${pins}"
          done
          # README states the MSRV for crates.io readers (#53); keep it honest.
          readme_rv=$(grep -m1 -oE 'MSRV[^0-9]*[0-9]+(\.[0-9]+)+' README.md \
            | grep -oE '[0-9]+(\.[0-9]+)+' | strip_cr)
          if [ -z "$readme_rv" ]; then
            echo "ERROR: no 'MSRV ... <version>' line found in README.md" >&2
            exit 1
          fi
          echo "Cargo.toml rust-version=$cargo_rv"
          echo "rust-toolchain.toml channel=$toolchain_ch"
          echo "README.md MSRV=$readme_rv"
          agree=0
          [ "$cargo_rv" = "$readme_rv" ] || agree=1
          while read -r pin; do
            [ "$pin" = "$toolchain_ch" ] || agree=1
          done <<< "$workflow_pins"
          # The dev toolchain must be at least the MSRV: compare major.minor.
          msrv_mm=$(echo "$cargo_rv" | sed -E 's/^([0-9]+)\.([0-9]+).*/\1 \2/')
          dev_mm=$(echo "$toolchain_ch" | sed -E 's/^([0-9]+)\.([0-9]+).*/\1 \2/')
          read -r msrv_maj msrv_min <<< "$msrv_mm"
          read -r dev_maj dev_min <<< "$dev_mm"
          if [ "$msrv_maj" -gt "$dev_maj" ] || \
             { [ "$msrv_maj" -eq "$dev_maj" ] && [ "$msrv_min" -gt "$dev_min" ]; }; then
            agree=1
          fi
          if [ "$agree" -ne 0 ]; then
            echo "ERROR: pin check failed — workflow toolchain pins must equal" >&2
            echo "rust-toolchain.toml channel=$toolchain_ch, README MSRV must equal" >&2
            echo "Cargo.toml rust-version=$cargo_rv, and the dev toolchain must be" >&2
            echo ">= rust-version (REVIEW.md \"MSRV / toolchain split\")." >&2
            exit 1
          fi

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # rustfmt is OS-independent; keep this on Linux only (neuromod / axon-encoder).
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # Exercises [profile.dev] (see #40/#41) — a misconfigured or reverted
      # dev profile fails to compile here.
      - name: Build (dev profile)
        run: cargo build --locked --all-features

      - name: Documentation
        run: cargo doc --locked --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Exercises [profile.release] (see #40/#41) — catches a release profile
      # that no longer compiles (e.g. an invalid lto/codegen-units setting).
      - name: Build (release profile)
        run: cargo build --locked --all-features --release

      # Exercises [profile.test] (see #40/#41).
      - name: Test (test profile)
        run: cargo test --locked --all-features

      # Release-mode tests: `debug_assert!` is stripped, so delay-buffer
      # capacity and inject bounds must still reject invalid input (#60).
      # Building the release profile alone is not enough.
      - name: Test (release profile)
        run: cargo test --locked --release --all-features

      # Exercises [profile.bench] (see #40/#41) and compiles the criterion
      # harness in `benches/` without running it (LIM-1222).
      - name: Bench compile check (bench profile)
        run: cargo bench --locked --all-features --no-run

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # The true MSRV lives in Cargo.toml `rust-version` and may be lower
      # than the dev toolchain pin (#106). Read it at run time so lowering
      # the MSRV never requires editing this workflow — and keep this job
      # free of literal `toolchain:`/`rust-version:` pins, which the
      # validate job requires to equal the dev channel.
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '\r')
          if [ -z "$msrv" ]; then
            echo "ERROR: no rust-version found in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal --no-self-update

      - name: cargo check on MSRV
        run: cargo "+${{ steps.msrv.outputs.version }}" check --locked --all-targets --all-features

      - name: cargo test on MSRV
        run: cargo "+${{ steps.msrv.outputs.version }}" test --locked --all-features

      # Release mode strips debug_assert!, so bounds checks must still
      # reject bad input on the MSRV too (same reason as the validate job).
      - name: cargo test on MSRV (release profile)
        run: cargo "+${{ steps.msrv.outputs.version }}" test --locked --release --all-features

  package:
    name: Package (crates.io dry-run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Keep identical to the other dev toolchain pins in this workflow; the
      # "Verify toolchain pins agree" step in `validate` checks every one.
      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.99.0

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-package-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-package-

      # A consumer of the crate needs source, Cargo manifests, licenses,
      # README, and CHANGELOG — nothing else. Anything new here is either a
      # missing `exclude` entry in Cargo.toml or a deliberate addition to
      # this allowlist (see #34/#49).
      - name: Review packaged file list
        shell: bash
        run: |
          set -euo pipefail
          # Written outside the checkout: an untracked file in the working
          # tree would make the `cargo package` step below fail as dirty.
          listing="${RUNNER_TEMP:-/tmp}/packaged-files.txt"
          cargo package --locked --list | tee "$listing"
          allowed='^(\.cargo_vcs_info\.json|CHANGELOG\.md|Cargo\.lock|Cargo\.toml|Cargo\.toml\.orig|LICENSE-[A-Za-z0-9.-]+|README\.md|(src|tests|benches|examples)/.+\.rs)$'
          unexpected=$(grep -Ev "$allowed" "$listing" || true)
          if [ -n "$unexpected" ]; then
            echo "ERROR: unexpected files in the packaged crate — add them to" >&2
            echo "       'exclude' in Cargo.toml, or to the allowlist above:" >&2
            echo "$unexpected" | sed 's/^/  /' >&2
            exit 1
          fi
          # The mirror image: an over-eager `exclude` (or a renamed file)
          # must not silently drop something consumers rely on.
          for required in Cargo.toml README.md CHANGELOG.md LICENSE-MIT \
            LICENSE-APACHE-2.0 src/lib.rs; do
            if ! grep -qxF "$required" "$listing"; then
              echo "ERROR: $required is missing from the packaged crate" >&2
              exit 1
            fi
          done

      - name: Package the crate
        run: cargo package --locked

      # Exact registry dry-run against the built artifact. No token is
      # needed; nothing is uploaded.
      - name: Publish dry-run (no upload)
        run: cargo publish --locked --dry-run

      # The crate defines no features, so this trivially passes — it pins
      # the independently-consumable shape (no default-gated native-only
      # dependency may sneak in later without failing here).
      - name: Check with no default features
        run: cargo check --locked --no-default-features

      # Build the packaged .crate outside the repository, so a source file
      # dropped by `exclude` (or a build that silently relies on a repo-only
      # file such as rust-toolchain.toml) fails here instead of on crates.io.
      - name: Check the unpacked crate builds standalone
        shell: bash
        run: |
          set -euo pipefail
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          pkg=$(grep -m1 '^name' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$msrv" ] || [ -z "$version" ] || [ -z "$pkg" ]; then
            echo "ERROR: could not read name/rust-version/version from Cargo.toml" >&2
            exit 1
          fi
          rustup toolchain list | grep -q "^${msrv}-" \
            || rustup toolchain install "$msrv" --profile minimal --no-self-update
          # Exact filename, not a glob: a restored cache can leave an older
          # .crate in target/package/ that tar would treat as a member path.
          crate="target/package/${pkg}-${version}.crate"
          work=$(mktemp -d)
          tar -xzf "$crate" -C "$work"
          cd "$work/${pkg}-${version}"
          cargo "+$msrv" check --locked --all-targets

  semver-checks:
    name: Semver compatibility
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2

  cargo-deny:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Keep in sync with the dev toolchain pin in REVIEW.md (issue #35).
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.0"
