# Docker build + push (GHCR always; Docker Hub when credentials exist).
# Third-party Actions are pinned to immutable commit SHAs.
#
# PR: verify runtime image + builder tests (contents: read only).
# main push: publish :SHA tags.
# v* tags: also publish :version and :latest only when the tag matches
# Cargo.toml and the tagged commit is already on origin/main.
name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-verify:
    name: docker verify
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        # Optional: only when same-repo PR has Hub credentials (faster base pulls).
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && vars.DOCKER_USER != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set image tags
        id: image
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "tags=synaptic-mesh:pr-${SHA}" >> "$GITHUB_OUTPUT"
          echo "verify_tag=synaptic-mesh:pr-${SHA}" >> "$GITHUB_OUTPUT"
          echo "builder_tag=synaptic-mesh:builder-pr-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build runtime image (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime image (docs + version stamp)
        run: |
          set -euo pipefail
          # Library crate: no examples/ or [[bin]]. Assert the docs snapshot
          # and VERSION stamp rather than inventing a fake binary.
          expected=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          actual=$(docker run --rm "${{ steps.image.outputs.verify_tag }}")
          test -n "${expected}"
          test "${actual}" = "${expected}"
          docker run --rm --entrypoint test "${{ steps.image.outputs.verify_tag }}" \
            -f /usr/share/doc/synaptic-mesh/synaptic_wiring/index.html
          docker run --rm --entrypoint test "${{ steps.image.outputs.verify_tag }}" \
            -s /usr/share/synaptic-mesh/VERSION
          docker run --rm --entrypoint ls "${{ steps.image.outputs.verify_tag }}" \
            -la /usr/share/synaptic-mesh /usr/share/doc/synaptic-mesh/synaptic_wiring

      - name: Build builder stage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          target: builder
          tags: ${{ steps.image.outputs.builder_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Re-run cargo test via builder CMD
        run: |
          set -euo pipefail
          # Builder Dockerfile CMD is cargo test --all-features --locked
          # (tests also run in a RUN layer during the image build).
          docker run --rm "${{ steps.image.outputs.builder_tag }}"

  docker-publish:
    name: docker publish
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      # Push images. Does not make a new GHCR package public; anonymous
      # pulls still need package visibility set in GitHub Packages.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Detect Docker Hub credentials
        id: hub
        env:
          DOCKER_USER: ${{ vars.DOCKER_USER }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_USER:-}" ] && [ -n "${DOCKER_PAT:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "user=${DOCKER_USER}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "user=" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials not configured; publishing GHCR only"
          fi

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ steps.hub.outputs.user }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set image tags
        id: image
        env:
          HUB_ENABLED: ${{ steps.hub.outputs.enabled }}
          HUB_USER: ${{ steps.hub.outputs.user }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prefer runner env (GITHUB_REF/SHA) over ${{ }} interpolation in shell.
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          # Tolerate missing match so we can emit a clear error (set -e + grep).
          VER=$(grep -m1 '^version' Cargo.toml 2>/dev/null | sed -E 's/.*"([^"]+)".*/\1/' || true)
          # Cargo semver: X.Y.Z with optional prerelease / build metadata
          # (e.g. 0.3.0-rc.1, 0.3.0+build.1).
          cargo_ver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [ -z "${VER}" ] || ! printf '%s' "${VER}" | grep -Eq "${cargo_ver_re}"; then
            echo "::error::Failed to extract a Cargo version from Cargo.toml (got: ${VER:-empty})"
            exit 1
          fi
          GHCR="ghcr.io/limen-neural/synaptic-mesh"
          # Always publish immutable commit SHA (main or tag push).
          TAGS="${GHCR}:${SHA}"
          if [ "${HUB_ENABLED}" = "true" ] && [ -n "${HUB_USER}" ]; then
            TAGS="${TAGS},${HUB_USER}/synaptic-mesh:${SHA}"
          fi
          # Version + latest only on release tags whose name matches Cargo.toml
          # and whose commit is already on origin/main (reviewed). A matching
          # v* tag on an unreviewed SHA must not overwrite :version / :latest.
          # Read GITHUB_REF from the runner env (do not embed ${{ github.ref }} in shell).
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            if [ "${TAG_VER}" != "${VER}" ]; then
              echo "::error::Git tag '${GITHUB_REF}' (v${TAG_VER}) does not match Cargo.toml version ${VER}"
              exit 1
            fi
            # Docker/OCI tags cannot contain '+'; Cargo build metadata is
            # accepted above so the git tag can still match Cargo.toml.
            if ! printf '%s' "${VER}" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'; then
              echo "::error::Cargo version '${VER}' matches the git tag but is not a valid Docker tag (e.g. '+' in build metadata)"
              exit 1
            fi
            ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" --jq '.ahead_by')
            if [ "${ahead}" != "0" ]; then
              echo "::warning::Git tag '${GITHUB_REF}' points at ${SHA}, which is not on origin/main (compare ahead_by=${ahead}); publishing SHA only, not :${VER} or :latest"
            else
              TAGS="${TAGS},${GHCR}:${VER},${GHCR}:latest"
              if [ "${HUB_ENABLED}" = "true" ] && [ -n "${HUB_USER}" ]; then
                TAGS="${TAGS},${HUB_USER}/synaptic-mesh:${VER},${HUB_USER}/synaptic-mesh:latest"
              fi
            fi
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Publishing tags: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
