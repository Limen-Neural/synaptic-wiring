# Devin environment blueprint for synaptic-wiring.
#
# This file is a version-controlled REFERENCE ONLY. Devin blueprints are not
# auto-read from the repo — the copy in Devin's
# Settings > Environment > Blueprints > synaptic-wiring UI must be updated
# to match this file whenever either side changes.

initialize: |
  # Read the dev toolchain pin straight out of rust-toolchain.toml so this
  # can never drift to `stable` or whatever the image default happens to
  # be; it fails loudly if the file is missing or the pin can't be
  # parsed. The extraction mirrors the pin check in ci.yml. Repo-level
  # blueprint steps run in the cloned repository root, so the file is
  # always present. No `rustup default` needed: rust-toolchain.toml
  # auto-selects the toolchain for every cargo/rustc invocation inside
  # the repo.
  channel=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '\r')
  if [ -z "$channel" ]; then
    printf '%s\n' 'Could not read the Rust channel from rust-toolchain.toml' >&2
    exit 1
  fi
  rustup toolchain install "$channel" --component clippy --component rustfmt

maintenance: |
  cargo fetch --locked

knowledge:
  - name: format-check
    contents: cargo fmt --check
  - name: test
    contents: cargo test --locked
  - name: lint
    contents: cargo clippy --all-features -- -D warnings
  - name: review-gate
    contents: |
      Before opening or updating a PR, run every command in REVIEW.md
      (format check, locked test matrix, clippy, regression guards,
      diff hygiene, origin hygiene). All must pass; REVIEW.md's
      "Pass criteria" section is the merge bar.
  - name: repo-map
    contents: See AGENTS.md for module map, entry order, and design principles.
