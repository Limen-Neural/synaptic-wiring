[package]
name = "synaptic-wiring"
version = "0.3.0"
edition = "2024"
# Keep identical to rust-toolchain.toml `channel` and the CI / coverage
# workflow `toolchain:` pins (see REVIEW.md "MSRV pin rule").
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "An SNN-based mesh for managing the wiring, topology, and temporal delays between neurons."
authors = ["Raul Cardenas Montoya <montoyaraul34@gmail.com>"]
repository = "https://github.com/Limen-Neural/synaptic-wiring"
documentation = "https://docs.rs/synaptic-wiring"
homepage = "https://docs.rs/synaptic-wiring"
readme = "README.md"
keywords = ["snn", "spiking", "neuromorphic", "topology", "routing"]
categories = ["science", "algorithms", "simulation"]
# Dev tooling and repo-only assets a crates.io consumer never needs, so the
# published .crate is source + Cargo manifests + licenses + README +
# CHANGELOG. CI's `package` job asserts the packaged file list; run
# `cargo package --locked --list` locally after touching this list.
# See issues #34, #49, and #36.
exclude = [
    "/docs/",
    "/.github/",
    "/.config/",
    "/REVIEW.md",
    "/.codacy.yml",
    "/.deepsource.toml",
    "/.devin/",
    "/.gitignore",
    "/AGENTS.md",
    "/deny.toml",
    "/rust-toolchain.toml",
    "/Dockerfile",
    "/.dockerignore",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1.0"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "propagate"
harness = false

[workspace]

# See REVIEW.md "Build profiles" for a table of when to use each profile
# below and the command that invokes it.

# Fast iteration: no optimization, full debug info, incremental compiles.
[profile.dev]
opt-level = 0
debug = true
incremental = true

# Slightly optimized so the growing unit/property-test suite (GH#21) runs
# faster, while keeping compile times close to `dev`.
[profile.test]
inherits = "dev"
opt-level = 1

# Tuned for the crates.io publish (GH#37): maximize runtime performance and
# minimize binary size, with thin LTO to keep build times reasonable.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Mirrors `release` so criterion benches (`cargo bench`) reflect real
# release performance, but keeps debug symbols (`strip = false`) so
# profilers can still symbolize (override `release`'s strip).
[profile.bench]
inherits = "release"
debug = true
strip = false
